name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works both ways: project files in the repo root, OR the project uploaded as ONE .zip in the repo root.
      - name: Find / unpack project
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR=.
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: no settings.gradle.kts and no .zip in repo root. Files here:"; ls -la; exit 1
            fi
            mkdir -p _proj
            unzip -q "$ZIP" -d _proj
            DIR=$(dirname "$(find _proj -name settings.gradle.kts | head -n 1)")
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project dir: $DIR"
          ls -la "$DIR"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK. We only accept licenses so Gradle can fetch platform 35.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: InkNotes-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
